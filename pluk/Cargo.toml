[package]
name = "pluk"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3 # or 0, 1, 2, 3, s, z

[features]
# Int = i128 instead of i64 for computed values (plan/NUMERIC.design.txt section 6).
int128 = []

[dependencies]
flate2 = "1.1.10"
regex = "1.13.1"
memchr = "2.8.3"
noodles-bam = "0.98.0"
noodles-bgzf = "0.52.0"
noodles-sam = "0.93.0"
md-5 = "0.11.0"
jiff = "0.2.39"

# outcomment something with ^#
[lints.rust]
unused_variables = "allow"
unused_imports = "allow"
unused_crate_dependencies = "allow"
dead_code = "allow"

